[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mirago"
version = "0.1.0"
description = "Catch AI code hallucinations before they ship. The linter for AI-generated imports."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "ddsyasas"}
]
keywords = [
    "ai",
    "linter",
    "hallucination",
    "slopsquatting",
    "code-quality",
    "static-analysis",
    "security",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Quality Assurance",
    "Topic :: Security",
]
dependencies = [
    "typer>=0.12.0",
    "rich>=13.0.0",
    "httpx>=0.27.0",
    "platformdirs>=4.0.0",
    "tomli>=2.0.0; python_version < '3.11'",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.5.0",
    "mypy>=1.8.0",
]

[project.scripts]
mirago = "mirago.cli:app"

[project.urls]
Homepage = "https://github.com/ddsyasas/mirago"
Repository = "https://github.com/ddsyasas/mirago"
Issues = "https://github.com/ddsyasas/mirago/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
mirago = ["data/*.txt"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"
markers = [
    "network: tests that require live PyPI access (skipped in CI by default)",
]

[tool.mypy]
files = ["src"]
python_version = "3.10"
warn_unused_ignores = true
warn_redundant_casts = true
disallow_untyped_defs = true
no_implicit_optional = true

[[tool.mypy.overrides]]
module = ["tomli"]
ignore_missing_imports = true

[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = ["tests/fixtures"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
# Typer requires Argument/Option calls in default values; this is the canonical pattern.
"src/mirago/cli.py" = ["B008"]
